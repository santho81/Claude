name: Live API smoke

# Calls the real endpoint (rate limit: 60 requests/window), including @performance.
# Scheduled and manual only, so third-party outages or latency never block PRs.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run Cucumber tests (live)
        run: npm run test:live

      - name: Publish results summary
        if: always()
        run: npm run summary

      - name: Upload Cucumber reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports-live
          path: |
            reports/cucumber-report.html
            reports/cucumber-report.json
          if-no-files-found: warn
          retention-days: 7
